<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Obsidian Container for universal light/dark GitHub contrast -->
  <rect width="500" height="500" rx="48" fill="#0A0A0A" />
  
  <g fill="none" stroke="#F4F3F1" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Monolithic Prism Silhouette (Shortened & Proportioned) -->
    <polygon points="250,40 380,100 380,400 250,460 120,400 120,100" />
    
    <!-- Central Vertical Axis -->
    <line x1="250" y1="40" x2="250" y2="460" />
    
    <!-- Upper Vector Facets -->
    <polyline points="250,40 190,135 250,210 310,135 250,40" />
    <line x1="120" y1="100" x2="190" y2="135" />
    <line x1="380" y1="100" x2="310" y2="135" />
    
    <!-- Central Diamond & Converging Vectors -->
    <polyline points="120,100 250,255 380,100" />
    <polyline points="120,400 250,245 380,400" />
    
    <!-- Lower Vector Facets & Chevron Base -->
    <polyline points="250,460 190,365 250,290 310,365 250,460" />
    <line x1="120" y1="400" x2="190" y2="365" />
    <line x1="380" y1="400" x2="310" y2="365" />
    
    <!-- Lateral Framing Struts -->
    <line x1="190" y1="135" x2="190" y2="365" />
    <line x1="310" y1="135" x2="310" y2="365" />
  </g>
</svg>
