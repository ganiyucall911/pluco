<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" fill="url(#bg)" rx="96" />
  
  <!-- Outer Geometric Octagonal Ring -->
  <polygon points="256,48 403,109 464,256 403,403 256,464 109,403 48,256 109,109" 
           fill="none" stroke="#F4F3F1" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Inscribed 45-degree Diamond Vector Truss -->
  <polygon points="256,96 416,256 256,416 96,256" 
           fill="none" stroke="#F4F3F1" stroke-width="10" stroke-linejoin="round" />

  <!-- 4 Orthogonal Monolith Facets (North, East, South, West) -->
  <!-- North Pillar -->
  <polygon points="236,128 276,128 266,216 246,216" fill="#F4F3F1" />
  <!-- South Pillar -->
  <polygon points="236,384 276,384 266,296 246,296" fill="#F4F3F1" />
  <!-- West Pillar -->
  <polygon points="128,236 128,276 216,266 216,246" fill="#F4F3F1" />
  <!-- East Pillar -->
  <polygon points="384,236 384,276 296,266 296,246" fill="#F4F3F1" />

  <!-- 4 Diagonal Vector Corner Braces -->
  <circle cx="168" cy="168" r="8" fill="#F4F3F1" />
  <circle cx="344" cy="168" r="8" fill="#F4F3F1" />
  <circle cx="344" cy="344" r="8" fill="#F4F3F1" />
  <circle cx="168" cy="344" r="8" fill="#F4F3F1" />

  <!-- Central Monolith Core Block -->
  <rect x="224" y="224" width="64" height="64" fill="#F4F3F1" rx="6" />
  <!-- Central Vector Aperture -->
  <polygon points="256,236 276,256 256,276 236,256" fill="#0A0A0A" />
</svg>