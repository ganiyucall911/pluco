name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /pluco-network
          NEXT_PUBLIC_VECTOLITH_CHAIN_ID: "8453"
          NEXT_PUBLIC_VECTOLITH_ART_CONTRACT: "0x1f49c091da217f73493a5b517f490865dbabe15d"
          NEXT_PUBLIC_VECTOLITH_REGISTRY: "0x9218b355bb2e69a0f53e072c697e74e1ad63f9ff"
          NEXT_PUBLIC_VECTOLITH_MARKETPLACE: "0x0bbdc74bd7144a32f29196753fd7727995df8e3c"
          NEXT_PUBLIC_REOWN_PROJECT_ID: ${{ vars.NEXT_PUBLIC_REOWN_PROJECT_ID || '399fb0ee03b4e2afa8d1682f56a11788' }}
          NEXT_PUBLIC_INFURA_API_KEY: ${{ secrets.NEXT_PUBLIC_INFURA_API_KEY }}

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: deploy ${{ github.sha }}
